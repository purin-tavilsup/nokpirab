name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required: lets this job request a signed OIDC token from GitHub, which
      # nuget.org exchanges for a short-lived API key. No stored secret.
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # SourceLink embeds commit information; a shallow clone loses it.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Verify tag matches package version
      # Without this a mistyped tag silently publishes the wrong version, or
      # re-publishes one that already exists on nuget.org.
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Nokpirab/Nokpirab.csproj)
        echo "tag=$TAG csproj=$VERSION"
        if [ "$TAG" != "$VERSION" ]; then
          echo "::error::Tag v$TAG does not match <Version>$VERSION</Version> in Nokpirab.csproj"
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack
      run: dotnet pack src/Nokpirab --no-build --configuration Release -p:ContinuousIntegrationBuild=true --output artifacts

    # Deliberately the second-to-last step: the temporary key is valid for one
    # hour, so it is requested immediately before the push, after the slow
    # build/test/pack work has already succeeded.
    - name: NuGet login (OIDC -> short-lived API key)
      uses: NuGet/login@v1
      id: login
      with:
        # nuget.org username (profile name), NOT an email address, and it must
        # be the owner holding the trusted publishing policy. Hardcoded because
        # it is already public on the package page; move it to a secret or a
        # repo variable if you would rather not have it in the workflow.
        user: Exconeer

    - name: Publish to NuGet
      # The .snupkg beside the .nupkg is pushed automatically.
      run: >
        dotnet nuget push "artifacts/*.nupkg"
        --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
